<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shinobiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff0077" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14172b" />
      <stop offset="100%" stop-color="#070913" />
    </radialGradient>
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="url(#shinobiGlow)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="52" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Cyber Shinobi Horns / Crest -->
  <path d="M40 32 L32 16 L48 24 Z" fill="url(#shinobiGlow)" filter="url(#neonFilter)" />
  <path d="M80 32 L88 16 L72 24 Z" fill="url(#shinobiGlow)" filter="url(#neonFilter)" />
  <polygon points="60,18 64,28 56,28" fill="#00f0ff" />

  <!-- Helmet Contour -->
  <path d="M36 38 C36 28, 84 28, 84 38 L88 56 C88 78, 76 90, 60 94 C44 90, 32 78, 32 56 Z" fill="#0c0e1a" stroke="url(#shinobiGlow)" stroke-width="2" />

  <!-- Visor Neon Arc -->
  <path d="M38 52 Q60 48 82 52 Q60 62 38 52 Z" fill="#00f0ff" opacity="0.9" filter="url(#neonFilter)" />
  <line x1="44" y1="52" x2="76" y2="52" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

  <!-- Lower Cyber Faceplate Mask -->
  <polygon points="46,66 60,62 74,66 70,82 60,86 50,82" fill="#13172b" stroke="#ff0077" stroke-width="1.5" />

  <!-- Mask Equalizer Vents -->
  <line x1="54" y1="70" x2="54" y2="78" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="68" x2="60" y2="80" stroke="#ff0077" stroke-width="2" stroke-linecap="round" />
  <line x1="66" y1="70" x2="66" y2="78" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />

  <!-- Collar Cyber Accents -->
  <path d="M30 96 L48 86 L60 92 L72 86 L90 96" stroke="url(#shinobiGlow)" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
