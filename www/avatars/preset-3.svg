<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <radialGradient id="bgGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1e1d" />
      <stop offset="100%" stop-color="#040b0b" />
    </radialGradient>
    <filter id="neuralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad3)" stroke="url(#neuralGrad)" stroke-width="2.5" />
  
  <!-- Neural Circuit Traces Background -->
  <path d="M24 38 L38 38 L46 26" stroke="#00ff88" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4" />
  <circle cx="46" cy="26" r="2" fill="#00ff88" opacity="0.6" />
  <path d="M96 38 L82 38 L74 26" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4" />
  <circle cx="74" cy="26" r="2" fill="#00f0ff" opacity="0.6" />
  <path d="M28 80 L40 80 L46 90" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4" />
  <circle cx="46" cy="90" r="2" fill="#00f0ff" opacity="0.6" />
  <path d="M92 80 L80 80 L74 90" stroke="#00ff88" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4" />
  <circle cx="74" cy="90" r="2" fill="#00ff88" opacity="0.6" />

  <!-- Cybernetic Skull / Phantom Head -->
  <path d="M38 36 C38 24, 82 24, 82 36 L86 56 C86 70, 76 74, 70 78 L70 86 C70 90, 50 90, 50 86 L50 78 C44 74, 34 70, 34 56 Z" fill="#061214" stroke="url(#neuralGrad)" stroke-width="2" />

  <!-- Cyber Eyes - Glowing Hexagons / Ovals -->
  <polygon points="46,50 52,47 54,53 50,57 44,55" fill="#00ff88" filter="url(#neuralGlow)" />
  <polygon points="74,50 68,47 66,53 70,57 76,55" fill="#00f0ff" filter="url(#neuralGlow)" />

  <!-- Forehead Data Node -->
  <polygon points="60,34 64,40 60,46 56,40" fill="url(#neuralGrad)" />
  <line x1="60" y1="46" x2="60" y2="58" stroke="#00ff88" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Digital Phantom Teeth / Audio Equalizer Port -->
  <rect x="52" y="76" width="3" height="7" rx="1" fill="#00ff88" />
  <rect x="57" y="74" width="3" height="10" rx="1" fill="#00f0ff" />
  <rect x="62" y="74" width="3" height="10" rx="1" fill="#00f0ff" />
  <rect x="67" y="76" width="3" height="7" rx="1" fill="#00ff88" />

  <!-- Cheek Cyber Seams -->
  <line x1="38" y1="62" x2="48" y2="66" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="82" y1="62" x2="72" y2="66" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
</svg>
