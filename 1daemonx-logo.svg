<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="daemonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#8b00ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glowing circle -->
  <circle cx="50" cy="50" r="44" stroke="url(#daemonGlow)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.6"/>
  <circle cx="50" cy="50" r="41" fill="#0c0d14" />
  
  <!-- Horns / Daemon Head Graphic -->
  <path d="M26 30 C 24 16, 35 12, 40 22 C 37 32, 33 38, 30 46 Z" fill="url(#daemonGlow)" filter="url(#neonBlur)" />
  <path d="M74 30 C 76 16, 65 12, 60 22 C 63 32, 67 38, 70 46 Z" fill="url(#daemonGlow)" filter="url(#neonBlur)" />

  <!-- Equalizer soundbars styled as a cyber mask -->
  <rect x="34" y="44" width="4.5" height="20" rx="2.2" fill="url(#daemonGlow)" />
  <rect x="42" y="38" width="4.5" height="30" rx="2.2" fill="url(#daemonGlow)" />
  <rect x="50" y="32" width="4.5" height="38" rx="2.2" fill="url(#daemonGlow)" />
  <rect x="58" y="38" width="4.5" height="30" rx="2.2" fill="url(#daemonGlow)" />
  <rect x="66" y="44" width="4.5" height="20" rx="2.2" fill="url(#daemonGlow)" />
  
  <!-- Sharp bottom accent -->
  <polygon points="50,78 44,72 56,72" fill="url(#daemonGlow)" />
</svg>
