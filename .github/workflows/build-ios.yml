name: Build iOS IPA (DaemonX Music)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Sync Web Assets to Native iOS Project
        run: |
          node scripts/prepare-www.js
          npx cap sync ios

      - name: Install Pods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Build Xcode Archive (Release)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DaemonX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean archive

      - name: Package Payload into DaemonX-Music.ipa
        run: |
          mkdir -p Payload
          cp -r build/DaemonX.xcarchive/Products/Applications/App.app Payload/DaemonX.app
          zip -r -9 DaemonX-Music.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaemonX-Music-iOS-IPA
          path: DaemonX-Music.ipa
          retention-days: 30
