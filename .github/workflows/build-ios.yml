name: Compilar IPA (iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar IPA (iOS) en macOS
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar proyecto web
        run: npm run build

      - name: Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: Compilar y empaquetar IPA
        run: |
          cd ios/App
          ARCHIVE_SUCCESS=false
          if xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""; then
            ARCHIVE_SUCCESS=true
          fi

          if [ "$ARCHIVE_SUCCESS" = false ]; then
            echo "⚠️ Archive directo no disponible sin firma. Compilando binario Release con DerivedData..."
            xcodebuild clean build \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

          mkdir -p build/Payload
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          elif [ -d "build/DerivedData/Build/Products/Release-iphoneos/App.app" ]; then
            cp -r build/DerivedData/Build/Products/Release-iphoneos/App.app build/Payload/
          else
            echo "❌ Error: No se encontró App.app compilado"
            find build -name "App.app"
            exit 1
          fi

          cd build
          zip -r -q DaemonX-Music.ipa Payload

      - name: Subir IPA generado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaemonX-Music-iOS-IPA
          path: ios/App/build/DaemonX-Music.ipa
          if-no-files-found: error
